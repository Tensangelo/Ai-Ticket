# Solo PostgreSQL en este paso. Frontend y backend se agregan despues.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-ticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_ticket}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_ticket}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
